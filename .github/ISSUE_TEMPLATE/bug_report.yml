name: Bug report
description: Report a connector problem without sharing credentials or private documents
title: '[Bug] '
labels: ['bug']
body:
  - type: input
    id: version
    attributes:
      label: Connector version
      placeholder: v0.8.1
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use a test file, redacted content, and public tool names
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual results
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed WPS tokens, authorization codes, private file content, and personal data
          required: true
