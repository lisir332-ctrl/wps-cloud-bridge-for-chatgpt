name: 功能建议
description: 提出有官方云端接口证据的功能改进
title: '[Feature] '
labels: ['enhancement']
body:
  - type: textarea
    id: goal
    attributes:
      label: 用户目标
      description: 请描述想在 ChatGPT 中完成的 WPS 任务
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: 官方接口或文档链接
      description: 网页按钮不等于个人云端接口已开放；请尽量给出官方接口说明
  - type: textarea
    id: validation
    attributes:
      label: 建议的读回验证方式
