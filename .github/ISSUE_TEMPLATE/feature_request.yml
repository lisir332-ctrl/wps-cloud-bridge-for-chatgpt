name: Feature request
description: Suggest a cloud feature with evidence from an official WPS API
title: '[Feature] '
labels: ['enhancement']
body:
  - type: textarea
    id: goal
    attributes:
      label: User goal
      description: What WPS task should work from ChatGPT?
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Official API or documentation link
      description: A website button alone does not establish a personal-cloud API
  - type: textarea
    id: validation
    attributes:
      label: Suggested readback or verification
